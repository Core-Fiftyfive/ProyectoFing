
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrado de un número</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/app.js" defer></script>
</head>
<body>
    <nav class="navegacion">
        <a href="../index.html">← Volver al inicio</a>
        <span class="etiqueta-azul">EJERCICIO 02</span>
    </nav>

    <main class="pagina">
        <section class="panel formulario">
            <div class="icono">02</div>
            <h1>Cuadrado de un número</h1>
            <p class="descripcion">Ingresa un número para elevarlo al cuadrado.</p>

            <form data-ejercicio="cuadrado">
                <label for="numero">Número</label>
                <input id="numero" type="number" step="any" required>

                <button type="submit">Calcular cuadrado →</button>
            </form>

            <div id="resultado" class="resultado" role="status"
                 aria-live="polite" hidden></div>
        </section>
    </main>

    <footer>Laboratorio 8 · JavaScript básico</footer>
</body>
